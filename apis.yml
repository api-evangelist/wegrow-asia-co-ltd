description: 'WeGrow asia CO., LTD. (威果) is a Taiwan-based agricultural technology company
  operating a franchise model for modern, technology-driven farming. It pairs 24-hour AI-assisted
  remote crop management with a transparent farmer profit-sharing model, specializing in high-value
  strawberries and cantaloupes while handling production, labor management, marketing, and logistics
  end to end ("you provide the land, we provide the labor and expertise"). WeGrow surfaced as a 500
  Global portfolio company. As of this enrichment pass it publishes a bilingual (TW/EN) marketing
  website only and exposes no public API, developer portal, documentation, or /.well-known discovery
  surface — every probed developer and well-known path returned HTTP 404.'
